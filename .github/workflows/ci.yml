name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-js:
    name: lint:js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - run: pnpm run -r --parallel --aggregate-output lint:js

  lint-types:
    name: lint:types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - run: pnpm run -r --parallel --aggregate-output lint:types

  test:
    name: test
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    container:
      # Make sure to grab the latest version of the Playwright image
      # https://playwright.dev/docs/docker#pull-the-image
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - run: pnpm run -r --parallel --aggregate-output test
      # For the Try Scenarios
      - id: set-matrix
        working-directory: ./demo
        run: |
          echo "matrix=$(pnpm -s dlx @embroider/try list)" >> $GITHUB_OUTPUT

  packaged-consumer:
    name: packaged consumer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      # Snapshot the built addon as an installed package copy (own node_modules,
      # consumer-resolved peers) instead of a workspace symlink, so the demo
      # builds Storybook exactly like a published-package consumer would.
      # Reproduces e.g. the #58 manager leak: bare `@ember/*` imports in
      # manager-reachable chunks fail Storybook's esbuild manager build.
      - name: Re-install with injected workspace dependencies
        run: pnpm install --config.inject-workspace-packages=true --no-frozen-lockfile
      # The flag must stay on every later pnpm call: the recorded lockfile
      # setting would otherwise fail (or silently undo) the pre-run dep check.
      - name: Build Storybook as a consumer would
        run: pnpm --config.inject-workspace-packages=true --filter demo build-storybook
      - name: Assert the build used the injected copy, not a workspace symlink
        run: |
          test "$(readlink -f demo/node_modules/ember-storybook)" != "$PWD/ember-storybook"

  try-scenarios:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.test.outputs.matrix)}}
    container:
      # Make sure to grab the latest version of the Playwright image
      # https://playwright.dev/docs/docker#pull-the-image
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    steps:
      - uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Apply Scenario
        run: pnpm dlx @embroider/try apply ${{ matrix.name }}
        working-directory: ./demo
      - name: Install Dependencies
        run: pnpm install --no-lockfile
      - name: Run Tests
        run: pnpm test
        working-directory: ./demo
        env: ${{ matrix.env }}
